<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Configuration Variables -->
    <script>
        const config = {
            serverName: "Discord Server",
            pageTitle: "Discord Server - Jetzt beitreten!",
            description: "Tritt unserem Discord Server bei! Eine vibrant Community mit interessanten Kanälen, Events und freundlichen Mitgliedern.",
            keywords: "Discord Server, Community, Gaming, Chat, beitreten",
            inviteLink: "https://discord.gg/DEININVITELINK",
            imageUrl: "images/image.png",
            imageWidth: 1920,
            imageHeight: 1080,
            language: "de"
        };
        
        // Dynamically set meta tags
        document.addEventListener('DOMContentLoaded', function() {
            document.title = config.pageTitle;
            document.querySelector('meta[name="description"]').content = config.description;
            document.querySelector('meta[name="keywords"]').content = config.keywords;
            document.querySelector('meta[property="og:title"]').content = config.pageTitle;
            document.querySelector('meta[property="og:description"]').content = config.description;
            document.querySelector('meta[property="og:url"]').content = config.inviteLink;
            document.querySelector('meta[property="og:image"]').content = config.imageUrl;
            document.querySelector('meta[property="og:site_name"]').content = config.serverName;
            document.querySelector('meta[name="twitter:title"]').content = config.pageTitle;
            document.querySelector('meta[name="twitter:description"]').content = config.description;
            document.querySelector('meta[name="twitter:image"]').content = config.imageUrl;
            document.querySelector('link[rel="canonical"]').href = config.inviteLink;
            document.querySelector('meta[http-equiv="refresh"]').content = `1; url=${config.inviteLink}`;
            document.querySelector('a').href = config.inviteLink;
        });
    </script>
    
    <!-- SEO Meta Tags (populated by config) -->
    <title>Discord Server - Jetzt beitreten!</title>
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="Discord Server">
    <meta name="robots" content="index, follow">
    <meta name="language" content="German">
    <meta http-equiv="content-language" content="de">
    
    <!-- Open Graph Meta Tags for Social Media (populated by config) -->
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="website">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="1080">
    <meta property="og:site_name" content="">
    
    <!-- Twitter Card Meta Tags (populated by config) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="">
    <meta name="twitter:description" content="">
    <meta name="twitter:image" content="">
    
    <!-- Canonical Tag (populated by config) -->
    <link rel="canonical" href="">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    
    <!-- Redirect after 1 second (populated by config) -->
    <meta http-equiv="refresh" content="1; url="">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin-top: 0;
            font-size: 28px;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Willkommen auf unserem Discord Server!</h1>
        <p>Du wirst in Kürze zum Discord Server weitergeleitet...</p>
        <p>Falls die Weiterleitung nicht funktioniert, <a href="">klicke hier um beizutreten</a>.</p>
    </div>
</body>

</html>
